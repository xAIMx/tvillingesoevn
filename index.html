<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18243a"><title>Tvillingesøvn</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px 14px 80px;max-width:680px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:10px 0 3px}p{color:#657083;margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid #e1e6ef;border-radius:20px;padding:14px;box-shadow:0 2px 10px #1a2a4010}.name{font-size:17px;font-weight:700;border:0;background:transparent;width:100%;min-width:0;color:#18243a}.status{text-align:center;padding:20px 0}.emoji{font-size:35px}.time{font-size:23px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}.muted{font-size:12px;color:#738094}.state{font-weight:600;margin-top:4px}.action{width:100%;border:0;border-radius:13px;background:#385de8;color:white;padding:15px 6px;font-size:14px;font-weight:700;cursor:pointer}.action.sleep{background:#177a66}.total{text-align:center;margin-top:14px;padding:12px 4px;background:#f4f6fa;border-radius:12px;font-weight:700}.total small{display:block;font-weight:400;color:#738094;margin-bottom:5px}section{margin-top:22px}h2{font-size:18px}button.secondary{border:1px solid #dce3ef;border-radius:10px;background:white;color:#27364f;padding:10px 12px;cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap}.entry{background:white;border-radius:12px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.entry strong{font-size:14px}.entry small{color:#657083}.entry button{border:0;background:#f0f2f6;padding:9px;border-radius:9px}dialog{border:0;border-radius:16px;padding:22px;width:min(92vw,400px)}dialog::backdrop{background:#0008}label{display:block;font-size:13px;margin:12px 0 5px}input[type=datetime-local],select{width:100%;padding:11px;border:1px solid #ccd4e1;border-radius:9px;font:inherit}dialog menu{padding:0;display:flex;gap:8px;justify-content:flex-end}footer{font-size:11px;color:#738094;margin-top:28px;line-height:1.7;text-align:center}.totals{display:grid;gap:7px;margin-top:14px}.totals .total{margin-top:0;padding:10px 4px}@media(max-width:360px){.card{padding:9px}.time{font-size:19px}.action{font-size:12px}}</style></head><body><header><div><h1>🌙 Tvillingesøvn</h1></div></header><div id="connection" class="muted" style="margin-bottom:12px">Forbinder…</div><div class="grid" id="cards"></div><section><h2>Søvnhistorik</h2><div class="tools"><button class="secondary" id="add">+ Tilføj manuelt</button><button class="secondary" id="export">Eksportér backup</button><button class="secondary" id="import">Indlæs backup</button><button class="secondary" id="logout">Log ud</button><input type="file" id="file" accept="application/json" hidden></div><div id="history"></div></section><footer>Tvillingesøvn · v2.1<br>© 2026 xAIMx · Alle rettigheder forbeholdes</footer><dialog id="login" style="max-width:430px"><form id="loginForm"><h2>🌙 Jeres Tvillingesøvn</h2><p>Log ind med den samme familiekonto på begge telefoner.</p><label for="email">E-mail</label><input type="email" id="email" autocomplete="username" required style="width:100%;padding:11px;border:1px solid #ccd4e1;border-radius:9px"><label for="password">Adgangskode</label><input type="password" id="password" autocomplete="current-password" minlength="6" required style="width:100%;padding:11px;border:1px solid #ccd4e1;border-radius:9px"><p id="loginError" role="alert" style="color:#b42318;font-size:13px"></p><button class="action" id="signIn">Log ind</button><button type="button" class="secondary" id="signUp" style="width:100%;margin-top:9px">Opret familiekonto</button></form></dialog><dialog id="editor"><form id="form"><h2 id="editTitle">Registrering</h2><label for="child">Barn</label><select id="child"><option value="0">Tvilling 1</option><option value="1">Tvilling 2</option></select><label for="start">Faldt i søvn</label><input id="start" type="datetime-local" required><label for="end">Vågnede (valgfrit, hvis barnet stadig sover)</label><input id="end" type="datetime-local"><menu><button type="button" class="secondary" id="cancel">Annuller</button><button class="action" style="width:auto;padding:10px 18px">Gem</button></menu></form></dialog><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id),KEY='tvillingesoevn-v1';
const fmt=ms=>{let m=Math.max(0,Math.floor(ms/60000));return `${Math.floor(m/60)} t ${m%60} min`};
const stamp=t=>new Date(t).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const local=t=>{let d=new Date(t),offset=d.getTimezoneOffset()*60000;return new Date(t-offset).toISOString().slice(0,16)};
const today=()=>{let d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={children:['Tvilling 1','Tvilling 2'],sessions:[]},editing=null,auth,db,user=null,unsubs=[],ready=false;
const status=message=>{$('connection').textContent=message};
function render(){let now=Date.now();$('cards').innerHTML=data.children.map((name,i)=>{let active=data.sessions.find(s=>s.child===i&&s.end===null),last=data.sessions.filter(s=>s.child===i&&s.end!==null).sort((a,b)=>b.end-a.end)[0],wake=active?null:last?.end,elapsed=active?now-active.start:wake?now-wake:null,total=data.sessions.filter(s=>s.child===i).reduce((sum,s)=>sum+Math.max(0,Math.min(s.end??now,now)-Math.max(s.start,today())),0),awake=Math.max(0,now-today()-total);return `<article class="card"><input class="name" aria-label="Navn på tvilling ${i+1}" data-name="${i}" value="${escapeHTML(name)}" maxlength="40"><div class="status"><div class="emoji">${active?'🌙':'☀️'}</div><div class="state">${active?'Sover':'Vågen'}</div><div class="time">${elapsed===null?'—':fmt(elapsed)}</div><div class="muted">${active?'Sovet i':'Vågen i'}</div></div><button class="action ${active?'sleep':''}" data-toggle="${i}" ${!ready?'disabled':''}>${active?'☀️ Vågnede':'🌙 Faldt i søvn'}</button><div class="totals"><div class="total"><small>Søvn i dag</small>${fmt(total)}</div><div class="total"><small>Vågen i dag</small>${fmt(awake)}</div></div></article>`}).join('');let rows=[...data.sessions].sort((a,b)=>b.start-a.start);$('history').innerHTML=rows.length?rows.map(s=>`<div class="entry"><div><strong>${escapeHTML(data.children[s.child])}</strong><br><small>${stamp(s.start)} – ${s.end===null?'sover nu':stamp(s.end)} · ${fmt((s.end??now)-s.start)}</small></div><div><button data-edit="${s.id}" aria-label="Ret registrering">✏️</button> <button data-delete="${s.id}" aria-label="Slet registrering">🗑️</button></div></div>`).join(''):'<p>Ingen registreringer endnu.</p>'}
const valid=(s,skip)=>!data.sessions.some(x=>x.id!==skip&&x.child===s.child&&s.start<(x.end??Infinity)&&x.start<(s.end??Infinity));
const sessionRef=id=>doc(db,'families',user.uid,'sessions',id);
async function upsert(s){if(!user||!ready)return;await setDoc(sessionRef(s.id),s)}
async function toggle(i){if(!ready)return;let now=Date.now(),active=data.sessions.find(s=>s.child===i&&s.end===null);if(active){await upsert({...active,end:now});return}let s={id:crypto.randomUUID(),child:i,start:now,end:null};if(!valid(s)){alert('Der er allerede en søvnperiode på dette tidspunkt.');return}await upsert(s)}
document.addEventListener('click',async e=>{let t=e.target;if(t.dataset.toggle!==undefined)await toggle(+t.dataset.toggle).catch(err=>alert(err.message));if(t.dataset.edit)openEdit(t.dataset.edit);if(t.dataset.delete&&confirm('Slet denne søvnperiode?'))await deleteDoc(sessionRef(t.dataset.delete)).catch(err=>alert(err.message))});
document.addEventListener('change',async e=>{if(e.target.dataset.name!==undefined&&user){let i=+e.target.dataset.name,children=[...data.children];children[i]=e.target.value.trim()||`Tvilling ${i+1}`;await setDoc(doc(db,'families',user.uid),{children}).catch(err=>alert(err.message))}});
function openEdit(id){editing=id;let s=data.sessions.find(s=>s.id===id);$('editTitle').textContent=s?'Ret søvnperiode':'Tilføj søvnperiode';$('child').innerHTML=data.children.map((n,i)=>`<option value="${i}">${escapeHTML(n)}</option>`).join('');$('child').value=s?.child??0;$('start').value=local(s?.start??Date.now());$('end').value=s?.end?local(s.end):'';$('editor').showModal()}
$('add').onclick=()=>{if(ready)openEdit(null)};$('cancel').onclick=()=>$('editor').close();
$('form').onsubmit=async e=>{e.preventDefault();let start=new Date($('start').value).getTime(),end=$('end').value?new Date($('end').value).getTime():null,s={id:editing||crypto.randomUUID(),child:+$('child').value,start,end};if(!Number.isFinite(start)||(end!==null&&(!Number.isFinite(end)||end<=start))||start>Date.now()+60000){alert('Kontrollér tidspunkterne.');return}if(end===null&&data.sessions.some(x=>x.child===s.child&&x.end===null&&x.id!==s.id)){alert('Barnet har allerede en aktiv søvnperiode.');return}if(!valid(s,s.id)){alert('Søvnperioden overlapper en anden registrering for samme barn.');return}try{await upsert(s);$('editor').close()}catch(err){alert(err.message)}};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tvillingesoevn-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.children)||d.children.length!==2||!Array.isArray(d.sessions)||!d.sessions.every(s=>[0,1].includes(s.child)&&Number.isFinite(s.start)&&(s.end===null||Number.isFinite(s.end))))throw Error('Ugyldig backup');if(confirm('Importer registreringerne til den fælles konto? Eksisterende registreringer bevares, men identiske ID-er overskrives.')){await setDoc(doc(db,'families',user.uid),{children:d.children});for(let s of d.sessions)await upsert(s);alert('Backup importeret')}}catch(err){alert('Backupfilen kunne ikke indlæses: '+err.message)}e.target.value=''};
$('logout').onclick=()=>signOut(auth);
const loginError=err=>{const code=err.code||'';$('loginError').textContent=code==='auth/email-already-in-use'?'E-mailen er allerede oprettet. Vælg Log ind.':code==='auth/invalid-credential'?'Forkert e-mail eller adgangskode.':code==='auth/weak-password'?'Vælg en stærkere adgangskode.':err.message};
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){loginError(err)}};
$('signUp').onclick=async()=>{if(!$('loginForm').reportValidity())return;if(!confirm('Opret én fælles familiekonto? Brug samme login på begge telefoner.'))return;try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){loginError(err)}};
async function start(){if(!firebaseConfig.apiKey||firebaseConfig.apiKey==='INDSAET_API_KEY'){status('Firebase er ikke konfigureret endnu. Se OPSAETNING.md.');return}const app=initializeApp(firebaseConfig);auth=getAuth(app);db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});onAuthStateChanged(auth,u=>{unsubs.forEach(fn=>fn());unsubs=[];user=u;ready=false;if(!u){data={children:['Tvilling 1','Tvilling 2'],sessions:[]};render();status('Log ind for at synkronisere');if(!$('login').open)$('login').showModal();return}if($('login').open)$('login').close();status('Henter fælles registreringer…');let profileLoaded=false,sessionsLoaded=false;const check=()=>{ready=profileLoaded&&sessionsLoaded;if(ready)status('✓ Fælles sync aktiv');render()};unsubs.push(onSnapshot(doc(db,'families',u.uid),snap=>{if(snap.exists()&&Array.isArray(snap.data().children))data.children=snap.data().children;profileLoaded=true;check()},err=>status('Synkroniseringsfejl: '+err.message)));unsubs.push(onSnapshot(collection(db,'families',u.uid,'sessions'),snap=>{data.sessions=snap.docs.map(d=>({...d.data(),id:d.id}));sessionsLoaded=true;check()},err=>status('Synkroniseringsfejl: '+err.message)))});}
render();setInterval(()=>{if(ready)render()},30000);start().catch(err=>status('Opsætningsfejl: '+err.message));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
